version: '3.8'

services:
  web:
    build: .
    entrypoint: ./entrypoint.sh
    command: make run
    volumes:
      - ./myproject/:/myproject
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password

volumes:
  postgres_data: